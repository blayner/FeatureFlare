name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  server:
    name: Server (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore server/FeatureFlare.sln

      - name: Build
        run: dotnet build server/FeatureFlare.sln -c Release --no-restore

      # global.json opts into Microsoft.Testing.Platform (required by xunit.v3 4.x on the .NET 10 SDK).
      - name: Test
        run: >
          dotnet test --solution server/FeatureFlare.sln -c Release --no-build
          --results-directory TestResults --report-xunit-trx

      - name: Check for vulnerable packages
        run: dotnet list server/FeatureFlare.sln package --vulnerable --include-transitive

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-test-results
          path: TestResults

  dotnet-sdk:
    name: .NET SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore sdks/dotnet/FeatureFlare.Sdk.sln
      - run: dotnet build sdks/dotnet/FeatureFlare.Sdk.sln -c Release --no-restore
      - run: dotnet test --solution sdks/dotnet/FeatureFlare.Sdk.sln -c Release --no-build
      - name: Pack
        run: dotnet pack sdks/dotnet/src/FeatureFlare.Sdk/FeatureFlare.Sdk.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: dotnet-sdk-package
          path: artifacts/*.nupkg

  typescript-sdk:
    name: TypeScript SDK (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: featureflare/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
